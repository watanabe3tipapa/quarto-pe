project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!drafts/"
  resources:
    - assets/

website:
  title: "quarto-pe"
  description: "Quarto の _quarto.yml 記法と Q markdown 構文のリファレンス・チートシート"
  site-url: "https://watanabe3tipapa.github.io/quarto-pe/"
  image: assets/quarto_check.jpg
  favicon: assets/quarto_check.jpg
  open-graph: true
  page-navigation: true
  navbar:
    aria-label: Main navigation
    search: true
    left:
      - href: index.qmd
        text: Home
      - text: リファレンス
        menu:
          - href: reference.qmd
            text: "_quarto.yml 記法"
          - href: notation.qmd
            text: "Q markdown 記法"
      - text: テンプレート集
        menu:
          - href: content3.qmd
            text: 設定テンプレート
          - href: content4.qmd
            text: コード実行・動的コンテンツ
          - href: content5.qmd
            text: 構造化・多形式
      - text: 事例
        menu:
          - href: content1.qmd
            text: 本サイトの設定
          - href: content2.qmd
            text: 実在サイトのYAML
    right:
      - href: "https://github.com/watanabe3tipapa/quarto-pe"
        text: GitHub
        icon: github
  page-footer:
    left: "© 2026 watanabe3tipapa"
    center: "Built with [Quarto](https://quarto.org/) — Neo-brutalism"
  repo-url: "https://github.com/watanabe3tipapa/quarto-pe"
  repo-actions: [edit]

format:
  html:
    theme:
      - cosmo
      - theme.scss
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    highlight-style: github

execute:
  echo: true
  warning: false
  error: false
  freeze: false

vars:
  author: "watanabe3tipapa"
  email: "toruwatanabe3ti@gmail.com"
  org: "quarto-pe"
  year: 2026

lang: ja

editor: visual
